# Kingdom Network - Production Nginx Config
# Single domain: kingdomnetwork.kitetool.com
# Frontend: React SPA (dist/)
# Backend: Laravel API (backend/public/)

# Upstream for Laravel (optional, can use fastcgi directly)
# upstream php {
#     server unix:/run/php/php8.2-fpm.sock;
# }

server {
    listen 80;
    listen [::]:80;
    server_name kingdomnetwork.kitetool.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all HTTP to HTTPS (after SSL is configured)
    # return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kingdomnetwork.kitetool.com;

    # SSL - managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/kingdomnetwork.kitetool.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kingdomnetwork.kitetool.com/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root for React SPA build
    root /var/www/kingdomnetwork/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API Routes - Proxy to Laravel
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Admin panel - serve via React (client-side routing)
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # Storage files (images, uploads)
    location /storage/ {
        # Serve from Laravel storage
        alias /var/www/kingdomnetwork/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Sitemap & Robots
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/v1/sitemap.xml;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/api/v1/robots.txt;
    }

    # Manifest & Service Worker (PWA)
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    # React SPA - Catch all for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to backup/config files
    location ~* \.(env|log|sql|bak|backup)$ {
        deny all;
    }
}

# Alternative: Run Laravel on separate port (if not using php-fpm)
# Start with: php artisan serve --host=127.0.0.1 --port=8000
# Or use php-fpm (recommended):
# 
# In the server block above, replace /api/ location with:
# 
# location /api/ {
#     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
#     fastcgi_param SCRIPT_FILENAME /var/www/kingdomnetwork/backend/public/index.php;
#     include fastcgi_params;
#     fastcgi_param PATH_INFO $fastcgi_path_info;
# }
# 
# And add this for Laravel public:
# location /storage/ {
#     alias /var/www/kingdomnetwork/backend/storage/app/public/;
# }
# 
# location ~ \.php$ {
#     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
#     fastcgi_param SCRIPT_FILENAME /var/www/kingdomnetwork/backend/public/index.php;
#     include fastcgi_params;
#     fastcgi_param PATH_INFO $fastcgi_path_info;
# }

# ============================================================
# SUPERVISOR CONFIG (for queue workers & artisan serve)
# ============================================================
# Save as: /etc/supervisor/conf.d/kingdomnetwork.conf
#
# [program:kingdomnetwork-api]
# command=php /var/www/kingdomnetwork/backend/artisan serve --host=127.0.0.1 --port=8000
# directory=/var/www/kingdomnetwork/backend
# autostart=true
# autorestart=true
# user=www-data
# stdout_logfile=/var/www/kingdomnetwork/backend/storage/logs/api.log
# redirect_stderr=true
# stopsignal=TERM
#
# [program:kingdomnetwork-worker]
# command=php /var/www/kingdomnetwork/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
# directory=/var/www/kingdomnetwork/backend
# autostart=true
# autorestart=true
# user=www-data
# numprocs=2
# process_name=%(program_name)s_%(process_num)02d
# stdout_logfile=/var/www/kingdomnetwork/backend/storage/logs/worker.log
# redirect_stderr=true
# ============================================================

# ============================================================
# CRON (for scheduler)
# ============================================================
# Run: crontab -e -u www-data
# Add:
# * * * * * cd /var/www/kingdomnetwork/backend && php artisan schedule:run >> /dev/null 2>&1
# ============================================================